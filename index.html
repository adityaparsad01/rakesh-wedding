<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rakesh &amp; Pooja Wedding Card Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Great+Vibes&family=Marcellus&family=Noto+Serif+Devanagari:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --primary-purple: #5c3b6f;
  --accent-gold: #c99846;
  --gold-gradient: linear-gradient(135deg, #dfb76c 0%, #b88628 50%, #e2be7a 100%);
  --deep-plum: #3e224e;
  --lavender-bg: #f9f6fc;
  --card-bg: #ffffff;
  --text-dark: #3b2547;
  --text-muted: #6e557b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(circle at 50% 10%, #f7f1fc 0%, #ede3f7 50%, #dfd0ed 100%);
  color: var(--text-dark);
  font-family: system-ui, "Noto Serif Devanagari", "Segoe UI", sans-serif;
  min-height: 100vh;
  padding: 24px 16px 48px;
}
.app {
  max-width: 1200px;
  margin: 0 auto;
}
header {
  text-align: center;
  margin-bottom: 24px;
}
.badge {
  display: inline-block;
  padding: 5px 16px;
  border-radius: 999px;
  background: #eedef9;
  color: var(--primary-purple);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 10px;
  border: 1px solid #d4bee7;
}
h1 {
  font-family: 'Cinzel', 'Noto Serif Devanagari', serif;
  font-size: clamp(26px, 4.5vw, 38px);
  color: var(--deep-plum);
  letter-spacing: 1px;
  margin-bottom: 8px;
  font-weight: 700;
}
header p {
  color: var(--text-muted);
  font-size: 15px;
  max-width: 640px;
  margin: 0 auto;
}
.main-layout {
  display: grid;
  grid-template-columns: 380px 1fr;
  gap: 32px;
  align-items: start;
}
@media (max-width: 960px) {
  .main-layout {
    grid-template-columns: 1fr;
  }
}
.sidebar {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid #dccde9;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 12px 36px rgba(92, 59, 111, 0.08);
}
@media (min-width: 961px) {
  .sidebar {
    position: sticky;
    top: 24px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
  }
}
.sidebar h2 {
  font-size: 18px;
  color: var(--deep-plum);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  border-bottom: 2px solid #f0e6f7;
  padding-bottom: 10px;
}
.form-group {
  margin-bottom: 12px;
}
label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--deep-plum);
  margin-bottom: 5px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #cfb8e2;
  border-radius: 10px;
  font-family: inherit;
  font-size: 15px;
  color: var(--text-dark);
  background: #fff;
  transition: all 0.2s ease;
}
select {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #cfb8e2;
  border-radius: 10px;
  font-family: inherit;
  font-size: 14.5px;
  color: var(--text-dark);
  background: #fff;
  cursor: pointer;
  transition: all 0.2s ease;
}
select:focus, input:focus {
  outline: none;
  border-color: var(--primary-purple);
  box-shadow: 0 0 0 3px rgba(92, 59, 111, 0.15);
}
.family-option {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0 3px;
  text-transform: none;
  letter-spacing: 0;
  font-size: 13.5px;
  cursor: pointer;
}
.family-option input {
  width: 17px;
  height: 17px;
  margin: 0;
  accent-color: var(--primary-purple);
}
.field-hint { display: block; color: var(--text-muted); font-size: 11px; line-height: 1.4; }
.btn-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 18px;
}
button {
  width: 100%;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: none;
}
.btn-primary {
  background: linear-gradient(135deg, #5c3b6f 0%, #3e224e 100%);
  color: #fff;
  box-shadow: 0 6px 18px rgba(62, 34, 78, 0.25);
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(62, 34, 78, 0.35);
}
.btn-gold {
  background: linear-gradient(135deg, #d8a649 0%, #b37e22 100%);
  color: #fff;
  box-shadow: 0 6px 18px rgba(179, 126, 34, 0.25);
}
.btn-gold:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(179, 126, 34, 0.35);
}
.btn-secondary {
  background: #f4ebfa;
  color: var(--deep-plum);
  border: 1px solid #dbc3ee;
}
.btn-secondary:hover {
  background: #e9d9f4;
}
.card-preview-area {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.preview-card-container {
  width: 100%;
  max-width: 580px;
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(71, 38, 92, 0.18), 0 2px 10px rgba(0,0,0,0.06);
  border: 1px solid rgba(220, 200, 235, 0.8);
  transition: transform 0.3s ease;
  animation: royalCardFloat 8s ease-in-out infinite;
}
.preview-card-container:hover {
  transform: translateY(-4px);
  animation-play-state: paused;
}
@keyframes royalCardFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
@media (prefers-reduced-motion: reduce) {
  .preview-card-container { animation: none; transition: none; }
}
#card-svg-wrapper {
  width: 100%;
  height: auto;
  display: block;
}
#card-svg-wrapper svg {
  width: 100%;
  height: auto;
  display: block;
}
.preview-meta {
  margin-top: 14px;
  font-size: 13px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 16px;
}
.feature-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #eddff7;
}
.tag {
  font-size: 12px;
  background: #f7f1fc;
  color: var(--primary-purple);
  padding: 4px 10px;
  border-radius: 6px;
  font-weight: 600;
}
footer {
  text-align: center;
  margin-top: 48px;
  font-size: 13px;
  color: var(--text-muted);
}
</style>
</head>
<body>
<main class="app">


  <div class="main-layout">
    <!-- SIDEBAR CONTROLS -->
    <aside class="sidebar">
      <h2>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        आमंत्रित अतिथि व विवरण
      </h2>



      <div class="form-group">
        <label for="guestName">आमंत्रित अतिथि का नाम (Guest Name)</label>
        <input type="text" id="guestName" maxlength="55" value="Ramesh" placeholder="जैसे: Shri Rajesh Sharma">
        <label class="family-option" for="inviteFamily">
          <input type="checkbox" id="inviteFamily">
          <span>With Family / सपरिवार</span>
        </label>
        <small class="field-hint">इसे केवल उन निमंत्रणों के लिए चुनें जहाँ परिवार सहित आमंत्रित करना हो।</small>
      </div>



      <div class="btn-group">
        <button class="btn-primary" id="downloadBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          HD PNG डाउनलोड करें
        </button>
        <button class="btn-gold" id="downloadHdBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          Print Ready (3405 × 4800 px)
        </button>

      </div>


    </aside>

    <!-- PREVIEW AREA -->
    <section class="card-preview-area">
      <div class="preview-card-container">
        <div id="card-svg-wrapper" aria-label="Wedding invitation card preview"></div>
      </div>

    </section>
  </div>


</main>

function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function getInviteeDisplayName() {
  const name = guestInput.value.trim();
  if (!name) return '';
  return familyInput.checked ? `${name} with Family` : name;
}

function updatePreview() {
  cardWrapper.innerHTML = makeCardSVG(
    getInviteeDisplayName(),
    DEFAULT_GROOM,
    DEFAULT_BRIDE,
    DEFAULT_DATE,
    DEFAULT_VENUE,
    DEFAULT_PHONE
  );
}

guestInput.addEventListener('input', updatePreview);
familyInput.addEventListener('change', updatePreview);




async function exportPNG(scale = 1, filename = 'Wedding-Card.png') {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const svgString = makeCardSVG(
    getInviteeDisplayName(),
    DEFAULT_GROOM,
    DEFAULT_BRIDE,
    DEFAULT_DATE,
    DEFAULT_VENUE,
    DEFAULT_PHONE
  );

  const blob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();

  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = 1135 * scale;
    canvas.height = 1600 * scale;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);

    const a = document.createElement('a');
    a.download = filename;
    a.href = canvas.toDataURL('image/png', 1.0);
    a.click();
  };

  img.onerror = function() {
    URL.revokeObjectURL(url);
    alert('PNG डाउनलोड करने में समस्या आई। कृपया Chrome/Firefox में पुनः प्रयास करें।');
  };

  img.src = url;
}

function getGuestFileName(isPrint = false) {
  const rawName = getInviteeDisplayName();
  if (!rawName) return isPrint ? 'Wedding-Card-Print.png' : 'Wedding-Card.png';
  // Keep letters, numbers, spaces, and hyphens so Hindi or English names stay fully readable
  const cleanName = rawName.replace(/[^\p{L}\p{N}\s_-]+/gu, '').trim() || 'Guest';
  return isPrint ? `${cleanName}-Print.png` : `${cleanName}.png`;
}

downloadBtn.addEventListener('click', () => {
  exportPNG(1, getGuestFileName(false));
});

downloadHdBtn.addEventListener('click', () => {
